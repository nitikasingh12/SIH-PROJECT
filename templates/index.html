<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Temple Crowd Monitoring — Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background:#f2f6fb; margin:0; padding:10px; }
    .wrap { display:flex; gap:16px; align-items:flex-start; }
    .video { border-radius:8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); overflow:hidden; }
    .panel { width: 320px; padding:16px; background:white; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.06);}
    .status { font-size:20px; font-weight:700; margin-bottom:8px;}
    .count { font-size:36px; font-weight:900; }
    img.heatmap { width:100%; border-radius:6px; margin-top:12px; }
  </style>
  <script src="https://cdn.socket.io/4.6.0/socket.io.min.js" integrity="" crossorigin="anonymous"></script>
</head>
<body>
  <h2>Temple Crowd Monitoring — Dashboard</h2>
  <div class="wrap">
    <div class="video">
      <img id="video" src="/video_feed" width="800" height="450" style="display:block;">
    </div>

    <div class="panel">
      <div class="status" id="status">Status: <span id="status_val">—</span></div>
      <div>Current Count</div>
      <div class="count" id="count_val">0</div>

      <div style="margin-top:8px;">
        <strong>Legend</strong>
        <div>Green: Safe (&lt; 50)</div>
        <div>Yellow: Risk (50–100)</div>
        <div>Red: Danger (&gt; 100)</div>
      </div>

      <div style="margin-top:12px;">
        <strong>Heatmap (coarse)</strong>
        <img id="heatmap_img" class="heatmap" src="/heatmap.png?ts=0">
      </div>
    </div>
  </div>

  <script>
    const socket = io();

    socket.on('connect', () => {
      console.log('connected to server');
    });

    socket.on('count_update', data => {
      document.getElementById('count_val').innerText = data.count;
      document.getElementById('status_val').innerText = data.status;
      let color = "black";
      if (data.status === "Safe") color = "green";
      else if (data.status === "Risk") color = "orange";
      else color = "red";
      document.getElementById('status_val').style.color = color;
      // refresh heatmap image with cache-busting
      const hm = document.getElementById('heatmap_img');
      hm.src = "/heatmap.png?ts=" + Date.now();
    });
  </script>
</body>
</html>
